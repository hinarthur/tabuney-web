{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Table Journey{% endblock title %}</title>

    {# ── SEO ── #}
    <meta name="description" content="{% block meta_description %}Table Journey{% endblock meta_description %}">
    <link rel="canonical" href="{{ canonical_url }}">

    <meta property="og:site_name" content="Table Journey">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}Table Journey{% endblock og_title %}">
    <meta property="og:description" content="{% block og_description %}Table Journey{% endblock og_description %}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta property="og:image" content="{% block og_image %}{{ SITE_URL }}{% static 'tablejourney/img/favicon/apple-icon-180x180.png' %}{% endblock og_image %}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Table Journey{% endblock twitter_title %}">
    <meta name="twitter:description" content="{% block twitter_description %}Table Journey{% endblock twitter_description %}">
    <meta name="twitter:image" content="{% block twitter_image %}{{ SITE_URL }}{% static 'tablejourney/img/favicon/apple-icon-180x180.png' %}{% endblock twitter_image %}">

    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" /> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/x-icon" href="{% static 'tablejourney/img/favicon/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="57x57" href="{% static 'tablejourney/img/favicon/apple-icon-57x57.png' %}">
    <link rel="apple-touch-icon" sizes="60x60" href="{% static 'tablejourney/img/favicon/apple-icon-60x60.png' %}">
    <link rel="apple-touch-icon" sizes="72x72" href="{% static 'tablejourney/img/favicon/apple-icon-72x72.png' %}">
    <link rel="apple-touch-icon" sizes="76x76" href="{% static 'tablejourney/img/favicon/apple-icon-76x76.png' %}">
    <link rel="apple-touch-icon" sizes="114x114" href="{% static 'tablejourney/img/favicon/apple-icon-114x114.png' %}">
    <link rel="apple-touch-icon" sizes="120x120" href="{% static 'tablejourney/img/favicon/apple-icon-120x120.png' %}">
    <link rel="apple-touch-icon" sizes="144x144" href="{% static 'tablejourney/img/favicon/apple-icon-144x144.png' %}">
    <link rel="apple-touch-icon" sizes="152x152" href="{% static 'tablejourney/img/favicon/apple-icon-152x152.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'tablejourney/img/favicon/apple-icon-180x180.png' %}">
    <link rel="icon" type="image/png" sizes="192x192"
        href="{% static 'tablejourney/img/favicon/android-icon-192x192.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'tablejourney/img/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="96x96" href="{% static 'tablejourney/img/favicon/favicon-96x96.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'tablejourney/img/favicon/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'tablejourney/img/favicon/manifest.json' %}">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="{% static 'tablejourney/img/favicon/ms-icon-144x144.png' %}">
    <meta name="theme-color" content="#ffffff">
    {% block extrahead %}
    {% endblock extrahead %}
</head>

<body>
    {% block content %}
    {% endblock content %}

    {% block extrascript %}
    {% endblock extrascript %}

</body>

</html>
