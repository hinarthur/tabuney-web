{% load static static_v translate_tags %}
{% comment %}
問卷浮動按鈕。參數：
  survey_kind        "edition" | "site"
  survey_edition_id  edition 問卷必填
  survey_page        送出時記在 SurveyResponse.page（分頁名或 path）

圖示 SVG 放在 <template>（用 currentColor，顏色由 CSS 決定），JS 依 kind 複製一份。
這裡只放設定與 UI 字串，按鈕本身由 survey.js 在確認「有開放中的問卷、而且還沒填過」
之後才畫出來，所以沒有問卷時頁面上什麼都不會出現。

csrf：只給已登入者。匿名渲染 {{ csrf_token }} 會讓瀏覽器拿到 csrftoken cookie，
後端對匿名請求不檢查 CSRF（feedback/security.py）。
譯文進 HTML 屬性一律 force_escape。
{% endcomment %}
{% if survey_kind == "site" %}{% t "feedback.survey.fab.site" as l_fab %}{% else %}{% t "feedback.survey.fab.edition" as l_fab %}{% endif %}
{% t "feedback.survey.dismiss" as l_dismiss %}
{% t "feedback.survey.submit" as l_submit %}
{% t "feedback.survey.thanks" as l_thanks %}
{% t "feedback.survey.multi_hint" as l_multi %}
{% t "feedback.survey.required_note" as l_required %}
{% t "feedback.survey.error.required" as l_err_required %}
{% t "feedback.survey.error.too_long" as l_err_long %}
{% t "feedback.survey.error.generic" as l_err_generic %}
{% t "feedback.survey.close" as l_close %}
{% t "feedback.survey.step" as l_step %}
{% t "feedback.survey.next" as l_next %}
{% t "feedback.survey.back" as l_back %}
<div id="tj-survey" hidden
     data-kind="{{ survey_kind }}"
     data-edition="{{ survey_edition_id|default:'' }}"
     data-edition-name="{{ survey_edition_name|default:''|force_escape }}"
     data-page="{{ survey_page|default:''|force_escape }}"
     data-lang="{{ request.lang|default:'en' }}"
     data-api="/api/feedback/surveys/"
     data-csrf="{% if request.user.is_authenticated %}{{ csrf_token }}{% endif %}"
     data-l-fab="{{ l_fab|force_escape }}"
     data-l-dismiss="{{ l_dismiss|force_escape }}"
     data-l-submit="{{ l_submit|force_escape }}"
     data-l-thanks="{{ l_thanks|force_escape }}"
     data-l-multi="{{ l_multi|force_escape }}"
     data-l-required="{{ l_required|force_escape }}"
     data-l-err-required="{{ l_err_required|force_escape }}"
     data-l-err-too-long="{{ l_err_long|force_escape }}"
     data-l-err-generic="{{ l_err_generic|force_escape }}"
     data-l-step="{{ l_step|force_escape }}"
     data-l-next="{{ l_next|force_escape }}"
     data-l-back="{{ l_back|force_escape }}"
     data-l-close="{{ l_close|force_escape }}"></div>
