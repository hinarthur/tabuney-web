<!doctype html>
<!-- 純靜態：由 nginx 在後端（gunicorn）沒回應時直接提供，不經過 Django / DB / 翻譯系統。
     CSS、JS 全部內嵌，不外連任何資源。 -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="15">
    <title>Tabuney</title>
    <style>
        :root { --bg: #F5F7FA; --text: #253247; --minor: #657287; --primary: #168BC3; --primary-light: #71C7D4; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #131A26; --text: #E8EEF5; --minor: #9CA9BB; }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; text-align: center; background: var(--bg); color: var(--text);
            font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        main { max-width: 560px; }
        .code {
            font-size: clamp(5rem, 22vw, 9rem); font-weight: 700; line-height: 1; letter-spacing: -0.04em;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        h1 { margin: 16px 0 12px; font-size: 1.6rem; line-height: 1.3; }
        p { margin: 0 auto 32px; max-width: 46ch; font-size: 1.0625rem; line-height: 1.7; color: var(--minor); }
        a {
            display: inline-block; padding: 12px 24px; border-radius: 999px; font-weight: 600;
            text-decoration: none; background: var(--primary); color: #fff;
        }
    </style>
</head>
<body>
    <main>
        <div class="code" aria-hidden="true">502</div>
        <h1 id="title">We'll be right back</h1>
        <p id="text">Tabuney is being updated. This page will refresh automatically in a few seconds.</p>
        <a id="retry" href="/">Try again</a>
    </main>
</body>
</html>
